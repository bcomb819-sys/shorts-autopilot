name: Shorts Autopilot 24/7 Cloud Poster

# Runs 5 times/day at global peak hours in GitHub's cloud — even when your laptop is completely turned OFF!
# Setup:
# 1. Push this folder (including vendor/faceless-shorts) to a GitHub repo.
# 2. In GitHub Repo -> Settings -> Secrets and variables -> Actions, add:
#      YT_CLIENT_ID, YT_CLIENT_SECRET, YT_REFRESH_TOKEN, GEMINI_API_KEY
# 3. Enable Actions -> workflow runs automatically 5x/day and commits data/history.json
#    so NO story is ever repeated!

on:
  schedule:
    # 6 Shorts/day at exact user IST peak times (triggered ~7 min early on off-peak :53/:23 to avoid GitHub :00/:30 delays & land on time!):
    # 02:53 UTC -> ~8:30 AM IST  | 06:23 UTC -> ~12:00 PM IST | 09:53 UTC -> ~3:30 PM IST
    # 12:53 UTC -> ~6:30 PM IST  | 14:53 UTC -> ~8:30 PM IST  | 16:53 UTC -> ~10:30 PM IST
    - cron: '53 2 * * *'
    - cron: '23 6 * * *'
    - cron: '53 9 * * *'
    - cron: '53 12 * * *'
    - cron: '53 14 * * *'
    - cron: '53 16 * * *'
  workflow_dispatch:
    inputs:
      style:
        description: 'Optional style override (blank = smart shuffle across all 6 styles)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  generate-and-post:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
      YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      NTFY_TOPIC: ${{ secrets.NTFY_TOPIC || 'storybyte-boss-701927' }}
      WHATSAPP_PHONE: '+917019192787'
      CALLMEBOT_API_KEY: ${{ secrets.CALLMEBOT_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      SKILL_DIR: ${{ github.workspace }}/vendor/faceless-shorts
      FACELESS_HOME: ${{ github.workspace }}/.faceless-shorts
      CHROME: /usr/bin/google-chrome
      CHROME_NO_SANDBOX: '1'
      SOFTWARE_GL: '1'
      QS: '&res=1&aa=0&shadow=1024'
      FPS: '30'
      FPS_3D: '24'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install FFmpeg & verify Google Chrome
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          google-chrome --version
          ffmpeg -version | head -n 1

      - name: Cache Kokoro & Whisper models + Python venv
        uses: actions/cache@v4
        with:
          path: |
            .faceless-shorts
            ~/.cache/huggingface
          key: faceless-models-v1-${{ runner.os }}

      - name: Ensure Python packages & models
        run: |
          if [ ! -x ".faceless-shorts/venv/bin/python" ]; then
            python3 -m venv .faceless-shorts/venv
            .faceless-shorts/venv/bin/pip install -q numpy scipy kokoro-onnx faster-whisper
          fi
          .faceless-shorts/venv/bin/python vendor/faceless-shorts/scripts/voice.py --download
          .faceless-shorts/venv/bin/python -c "from faster_whisper import WhisperModel; WhisperModel('small.en', device='cpu', compute_type='int8')"

      - name: Generate 100% unique Short & auto-post to YouTube
        run: |
          if [ -n "${{ github.event.inputs.style }}" ]; then
            node src/run-once.js --style=${{ github.event.inputs.style }}
          else
            node src/run-once.js
          fi

      - name: Save used-stories history so NO story ever repeats
        run: |
          git config user.name "Shorts Autopilot Bot"
          git config user.email "autopilot@users.noreply.github.com"
          git add data/history.json
          git diff --cached --quiet || git commit -m "autopilot: record published unique story [skip ci]"
          git push
